<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920">
  <defs>
    <style>
      .title { font: 700 34px Helvetica, Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 17px Helvetica, Arial, sans-serif; fill: #4b5563; }
      .section { font: 700 18px Helvetica, Arial, sans-serif; letter-spacing: 1px; fill: #334155; }
      .h { font: 700 21px Helvetica, Arial, sans-serif; fill: #111827; }
      .b { font: 400 16px Helvetica, Arial, sans-serif; fill: #374151; }
      .small { font: 400 13px Helvetica, Arial, sans-serif; fill: #475569; }
      .tiny { font: 400 12px Helvetica, Arial, sans-serif; fill: #64748b; }
      .math { font: italic 16px Georgia, serif; fill: #1f2937; }
      .whiteh { font: 700 21px Helvetica, Arial, sans-serif; fill: #ffffff; }
      .whiteb { font: 400 15px Helvetica, Arial, sans-serif; fill: #e0f2fe; }
      .box { rx: 22; ry: 22; filter: url(#shadow); }
      .thin { stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .arrow { stroke-width: 3.2; fill: none; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .arrowSoft { stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowSoft); stroke-dasharray: 7 8; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="agentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="theoryGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#c026d3"/>
    </linearGradient>
    <linearGradient id="physicsGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="dataGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecfdf5"/>
      <stop offset="1" stop-color="#bbf7d0"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <marker id="arrowSoft" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1600" height="920" fill="#ffffff"/>
  <text x="80" y="70" class="title">Autonomous Modified-Gravity Discovery Loop</text>
  <text x="80" y="103" class="subtitle">The agent proposes and learns; deterministic physics stages decide consistency and data fit.</text>

  <!-- Background bands -->
  <rect x="60" y="140" width="360" height="610" rx="34" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.6"/>
  <rect x="455" y="140" width="360" height="610" rx="34" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.6"/>
  <rect x="850" y="140" width="690" height="610" rx="34" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="95" y="178" class="section">AGENT</text>
  <text x="490" y="178" class="section">GRAMMAR-COMPILED THEORY</text>
  <text x="885" y="178" class="section">DETERMINISTIC PHYSICS VALIDATION</text>

  <!-- Agent column -->
  <rect class="box" x="95" y="220" width="290" height="145" fill="url(#agentGrad)"/>
  <text x="125" y="260" class="whiteh">Proposal policy</text>
  <text x="125" y="292" class="whiteb">select scalar sector</text>
  <text x="125" y="316" class="whiteb">potential type, operators</text>
  <text x="125" y="340" class="whiteb">and explicit samples</text>

  <rect class="box" x="95" y="455" width="290" height="135" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
  <text x="125" y="495" class="h">Reflection</text>
  <text x="125" y="527" class="b">read current-loop facts:</text>
  <text x="125" y="551" class="b">failures, accepted samples,</text>
  <text x="125" y="575" class="b">effective correction size</text>

  <rect class="box" x="95" y="635" width="290" height="82" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="125" y="671" class="h">Updated prior</text>
  <text x="125" y="699" class="b">soft bias only; cuts unchanged</text>

  <!-- Theory column -->
  <rect class="box" x="490" y="220" width="290" height="126" fill="url(#theoryGrad)"/>
  <text x="520" y="258" class="whiteh">Formal grammar</text>
  <text x="520" y="289" class="whiteb">curvature, ∇, φ₁/φ₂</text>
  <text x="520" y="313" class="whiteb">sector and dimension rules</text>

  <rect class="box" x="490" y="410" width="290" height="178" fill="#ffffff" stroke="#a855f7" stroke-width="2"/>
  <text x="520" y="448" class="h">Dimension-balanced</text>
  <text x="520" y="474" class="h">Lagrangian</text>
  <text x="520" y="512" class="math">√−g [ Mₚ² c Λ²⁻ᵈ O</text>
  <text x="520" y="540" class="math">+ c Λ⁴⁻ᵈ S + L_fixed ]</text>
  <text x="520" y="570" class="small">not a free-form expression</text>

  <rect class="box" x="490" y="645" width="290" height="72" fill="#f5f3ff" stroke="#c084fc" stroke-width="2"/>
  <text x="520" y="688" class="b">complete theory object passed downstream</text>

  <!-- Physics validation: funnel layout -->
  <rect class="box" x="895" y="210" width="280" height="96" fill="url(#physicsGrad)" stroke="#94a3b8" stroke-width="2"/>
  <text x="925" y="248" class="h">FLRW variation</text>
  <text x="925" y="276" class="b">E_N, E_a, E_φ from N,a,φᵢ</text>

  <rect class="box" x="1225" y="210" width="270" height="96" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="1255" y="248" class="h">Ghost-free gate</text>
  <text x="1255" y="276" class="b">remove higher derivatives</text>

  <rect class="box" x="895" y="365" width="280" height="112" fill="url(#physicsGrad)" stroke="#94a3b8" stroke-width="2"/>
  <text x="925" y="404" class="h">Friedmann constraint</text>
  <text x="925" y="432" class="b">Noether identity from</text>
  <text x="925" y="456" class="b">time diffeomorphism</text>

  <rect class="box" x="1225" y="365" width="270" height="112" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="1255" y="404" class="h">IVP gate</text>
  <text x="1255" y="432" class="b">solve hₓ, q₁ₓ, q₂ₓ</text>
  <text x="1255" y="456" class="b">or reject structurally</text>

  <rect class="box" x="895" y="540" width="280" height="112" fill="url(#physicsGrad)" stroke="#94a3b8" stroke-width="2"/>
  <text x="925" y="579" class="h">Dimensionless solve</text>
  <text x="925" y="607" class="b">x=ln a, h=H/H₀</text>
  <text x="925" y="631" class="b">constraint drift + EFT cuts</text>

  <rect class="box" x="1225" y="540" width="270" height="112" fill="url(#dataGrad)" stroke="#16a34a" stroke-width="2"/>
  <text x="1255" y="579" class="h">DES-SN + DESI BAO</text>
  <text x="1255" y="607" class="b">distance likelihood</text>
  <text x="1255" y="631" class="b">χ² = χ²_SN + χ²_BAO</text>

  <!-- Rejection memory bar -->
  <rect class="box" x="470" y="785" width="650" height="72" fill="#fff1f2" stroke="#f43f5e" stroke-width="2"/>
  <text x="505" y="827" class="h">Rejected proposals are retained</text>
  <text x="765" y="827" class="b">ghost / no RHS / root failure / drift / EFT violation</text>

  <rect class="box" x="1170" y="785" width="320" height="72" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="1205" y="827" class="h">Current-loop memory</text>
  <text x="1205" y="851" class="small">facts only, not new physics rules</text>

  <!-- Arrows main path -->
  <path class="arrow" d="M385 292 C425 292, 450 278, 490 278" stroke="#334155"/>
  <path class="arrow" d="M635 346 L635 410" stroke="#334155"/>
  <path class="arrow" d="M780 500 C830 500, 840 258, 895 258" stroke="#334155"/>
  <path class="arrow" d="M1175 258 L1225 258" stroke="#334155"/>
  <path class="arrow" d="M1360 306 C1360 340, 1035 330, 1035 365" stroke="#334155"/>
  <path class="arrow" d="M1175 421 L1225 421" stroke="#334155"/>
  <path class="arrow" d="M1360 477 C1360 515, 1035 505, 1035 540" stroke="#334155"/>
  <path class="arrow" d="M1175 596 L1225 596" stroke="#334155"/>

  <!-- Reject arrows -->
  <path class="arrowSoft" d="M1360 306 C1408 350, 1450 700, 1110 785" stroke="#dc2626"/>
  <path class="arrowSoft" d="M1495 421 C1545 520, 1445 722, 1110 785" stroke="#dc2626"/>
  <path class="arrowSoft" d="M1035 652 C970 720, 915 756, 850 785" stroke="#dc2626"/>

  <!-- Feedback loop -->
  <path class="arrow" d="M1490 821 C1545 865, 415 890, 240 717" stroke="#64748b"/>
  <path class="arrow" d="M240 590 L240 635" stroke="#64748b"/>
  <path class="arrow" d="M240 455 L240 365" stroke="#64748b"/>

  <!-- Labels -->
  <text x="405" y="263" class="tiny">grammar-valid proposal</text>
  <text x="805" y="474" class="tiny">validated object</text>
  <text x="1188" y="239" class="tiny">pass</text>
  <text x="1188" y="402" class="tiny">pass</text>
  <text x="1188" y="578" class="tiny">accepted trajectory</text>
  <text x="1180" y="765" class="tiny">all outcomes update the next proposal</text>
</svg>
